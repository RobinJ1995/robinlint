id: braces-dart
valid:
  - |
    var l = [
        if (a) 1,
        if (b) 2 else 3,
    ];
  - |
    void f() {
        if (a) {
            b();
        } else if (c) {
            d();
        } else {
            e();
        }
    }
  - |
    int f() {
        return a ? 1 : 2;
    }
invalid:
  - |
    void f() {
        if (a) b();
    }
  - |
    void f() {
        if (a)
            return;
    }
  - |
    void f() {
        if (a) {
            b();
        } else c();
    }
  - |
    void f() {
        if (a) {
            b();
        } else if (c) d();
    }
