id: function-reference-dart
valid:
  - 'void m() { a.map(f); }'
  - 'void m() { a.map((x) => foo.bar(x)); }'
  - 'void m() { a.map((x) => f(x, 1)); }'
  - 'void m() { a.map((x, y) => f(x)); }'
  - 'void m() { a.map((x, y) => f(y)); }'
  - 'void m() { a.map((x) => f(x).g()); }'
  - 'void m() { a.map((x) => f(1, x)); }'
  - 'void m() { a.map((x) => f(x) + 1); }'
  - 'void m() { a.map((x) => f(x)[0]); }'
  - 'void m() { a.sort((a, b) => f(b).compareTo(f(a))); }'
  - 'void m() { a.then((x) async => await f(x)); }'
  - 'void m() { a.where((x) => !f(x)); }'
  - 'void m() { a.map((x) => f(x)!); }'
  - 'void m() { a.map((x) => f(x) ?? 0); }'
  - 'void m() { a.map((x) => f(x: x)); }'
  - 'void m() { a.map(({x}) => f(x)); }'
  - 'void m() { a.map((x) => c ? f(x) : x); }'
  - "void m() { a.map((x) => '${f(x)}'); }"
  - 'Widget build(BuildContext c) { return Switch(value: on, onChanged: (v) => widget.onChanged(v)); }'
