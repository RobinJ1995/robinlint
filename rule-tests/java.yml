id: no-else-after-exit-java
valid:
  - |
    class A {
        int f() {
            if (a) {
                return a;
            } else if (b) {
                return b;
            }

            return c;
        }
    }
  - |
    class A {
        int f() {
            if (a) {
                x();
            } else {
                y();
            }
        }
    }
  - |
    class A {
        int f() {
            if (a) {
                return a;
            } else if (b) {
                x();
            } else {
                y();
            }
        }
    }
invalid:
  - |
    class A {
        int f() {
            if (a) {
                return a;
            } else if (b) {
