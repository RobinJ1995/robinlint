id: brace-style-java
valid:
  - |
    class A {
        void f() {
            if (a) {
                b();
            } else if (c) {
                d();
            } else {
                e();
            }
        }
    }
  - |
    class A {
        void f() {
            if (a) {
                b();
            }
            else {
                c();
            }
            if (a &&
                b) { // comment
                c();
            }
            if (a) {
            }
        }
    }
