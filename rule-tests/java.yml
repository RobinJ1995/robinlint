id: function-reference-java
valid:
  - 'a.forEach(this::f);'
  - 'a.forEach(x -> foo.bar(x));'
  - 'a.forEach(x -> f(x, 1));'
  - 'a.forEach((x, y) -> f(x));'
  - 'a.forEach(x -> { f(x); });'
  - 'a.forEach((x, y) -> f(y));'
  - 'a.forEach(x -> f(x).g());'
  - 'a.sort((a, b) -> f(b).compareTo(f(a)));'
  - 'a.filter(x -> !f(x));'
  - 'a.map(x -> f(g(x)));'
  - 'a.map(x -> (int) f(x));'
  - 'a.map(x -> f(x) + 1);'
  - 'a.forEach(x -> f(y));'
  - 'a.sort((a, b) -> compare(b, a));'
  - 'a.forEach((k, v) -> put(k, v, true));'
  - 'a.map(x -> super.f(x));'
invalid:
  - 'a.forEach(x -> f(x));'
  - 'a.forEach((x) -> f(x));'
  - 'a.sort((a, b) -> compare(a, b));'
  - 'a.map(x -> this.f(x));'
  - 'a.map(x -> b.stream().map(y -> f(y)));'
