id: braces-java
valid:
  - |
    class A {
        void f() {
            if (a) {
                b();
            } else if (c) {
                d();
            } else {
                e();
            }
        }
    }
  - |
    class A {
        int f() {
            return a ? 1 : 2;
        }
    }
invalid:
  - |
    class A {
        void f() {
            if (a) b();
        }
    }
  - |
    class A {
        void f() {
            if (a)
                return;
        }
    }
  - |
    class A {
        void f() {
            if (a) {
                b();
            } else c();
        }
    }
  - |
    class A {
        void f() {
            if (a) {
                b();
            } else if (c) d();
        }
    }
