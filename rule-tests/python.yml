id: function-reference-python
valid:
  - 'map(f, a)'
  - 'map(lambda x: json.loads(x), a)'
  - 'map(lambda x: f(x, 1), a)'
  - 'map(lambda x, y: f(x), a)'
  - 'map(lambda x, y: f(y), a)'
  - 'map(lambda x: f(x).g(), a)'
  - 'sorted(a, key=lambda x: f(x).lower())'
  - |
    for item in items:
        tasks.append(lambda item=item: process(item))
  - 'list(map(lambda args: f(*args), pairs))'
  - 'list(map(lambda kwargs: f(**kwargs), rows))'
  - 'points = map(lambda v: Point(x=v), xs)'
  - 'missing = filter(lambda p: not exists(p), paths)'
  - 'sorted(rows, key=lambda r: parse(r)[0])'
  - 'nums = map(lambda line: int(line.strip()), lines)'
  - 'labels = map(lambda x: str(x) if x else "", xs)'
invalid:
  - 'map(lambda x: f(x), a)'
  - 'sorted(names, key=lambda s: len(s))'
  - 'parts = list(map(lambda s: int(s), line.split(",")))'
  - 're.sub(pattern, lambda m: replace(m), text)'
