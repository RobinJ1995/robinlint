id: function-reference-kotlin
valid:
  - 'a.map(::f)'
  - 'a.map { x -> foo.bar(x) }'
  - 'a.map { foo.bar(it) }'
  - 'a.map { x -> f(x, 1) }'
  - 'a.map { x, y -> f(x) }'
  - 'a.map { f(it) { 1 } }'
  - 'a.map { x, y -> f(y) }'
  - 'a.map { x -> f(x).g() }'
  - 'a.map { f(it).g() }'
  - 'a.sortedWith { a, b -> f(b).compareTo(f(a)) }'
  - 'xs.forEach { scope.launch { send(it) } }'
  - 'xs.map { runCatching { parse(it) } }'
  - 'json.map { decode<User>(it) }'
  - 'xs.map { Item(name = it) }'
  - 'xs.map { s: String -> parse(s) }'
  - 'entries.map { (key, _) -> encode(key) }'
  - 'xs.forEach { x -> ys.forEach { add(x) } }'
  - 'xs.map { f(it.name) }'
  - 'view.apply { register(this) }'
