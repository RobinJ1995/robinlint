id: function-reference-javascript
valid:
  - 'a.map(f);'
  - 'a.map(x => JSON.parse(x));'
  - 'a.map(x => f(x, 1));'
  - 'a.map((x, y) => f(x));'
  - 'a.map(async x => f(x));'
  - 'a.map(x => f(y));'
  - 'a.map((x, y) => f(y));'
  - 'a.map(x => f(x).g());'
  - 'a.sort((a, b) => f(b).localeCompare(f(a)));'
  - 'a.map(x => f(...x));'
  - 'a.map(({ x }) => f(x));'
  - 'a.map((x = 1) => f(x));'
  - 'a.map((...x) => f(x));'
  - 'a.map(x => f?.(x));'
  - 'a.map(x => new Foo(x));'
  - 'a.map(x => import(x));'
  - 'a.map(x => !f(x));'
  - 'a.map(x => y => f(x));'
  - "['1', '2'].map(x => parseInt(x));"
  - 'await new Promise(resolve => setTimeout(resolve));'
  - 'Promise.all(urls.map(url => fetch(url)));'
invalid:
  - 'a.map(x => f(x));'
  - 'a.map((x) => f(x));'
  - 'a.map(x => Number(x));'
  - 'promise.then((user) => render(user)).catch(e => report(e));'
---
id: no-single-parameter-brackets-javascript
valid:
  - 'const f = y => y;'
  - 'const f = (x, y) => x;'
  - 'const f = () => 1;'
  - 'const f = ({ y }) => y;'
  - 'const f = (y = 1) => y;'
  - 'const f = (...y) => y;'
  - 'function f(y) { return y; }'
  - 'const f = ([a, b]) => a + b;'
  - 'const f = ({ a } = {}) => a;'
  - 'const f = async (a, b) => a;'
  - 'const f = function (a) { return a; };'
  - |
    class A {
        m(a) {
            return a;
        }
    }
  - |
    // @flow
    const f = (x: number) => x;
invalid:
  - 'const f = (y) => y;'
  - 'const f = async (y) => y;'
  - 'xs.map((x) => x * 2);'
  - 'const f = (a) => (b) => a + b;'
  - |
    const f = (x) => {
        return x;
    };
