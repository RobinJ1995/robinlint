id: braces-javascript
valid:
  - |
    if (a) {
        b();
    }
  - |
    if (a) {
        b();
    } else {
        c();
    }
  - |
    if (a) {
        b();
    } else if (c) {
        d();
    } else {
        e();
    }
  - 'x = a ? b : c;'
  - |
    if (a) /* why */ {
        b();
    }
  - |
    if (a) {
        b();
    } else /* why */ {
        c();
    }
  - |
    if (a) {
        b();
    } else /* why */ if (c) {
        d();
    }
  - |
    if (a) {
    } else {
    }
  - 'for (const x of xs) x();'
  - 'a && b();'
invalid:
  - if (a) b();
  - if (a) return;
  - |
    if (a) {
        b();
    } else c();
  - |
    if (a) {
        b();
    } else if (c) d();
  - |
    if (a)
        b();
  - |
    if (a) {
        b();
    } else
        // comment
        c();
  - |
    if (a) if (b) {
        c();
    }
  - |
    if (a) b();
    else {
        c();
    }
  - |
    if (a) {
        b();
    } else if (c) {
        d();
    } else e();
  - |
    for (const x of xs) {
        if (!x) continue;
        y(x);
    }
---
id: elseif-javascript
valid:
  - |
    if (a) {
        return 1;
    } else if (b) {
        x = 1;
    }
  - |
    if (a) {
        x = 1;
    }
    if (b) {
        y = 1;
    }
  - |
    if (a) {
        return 1;
    } else {
        x = 1;
    }
    if (b) {
        y = 1;
    }
  - |
    if (a) {
        return 1;
    } else if (b) {
        x = 1;
    }
    if (c) {
        y = 1;
    }
  - |
    if (a) {
        if (b) {
            return 1;
        }
        x = 1;
    }
    if (c) {
        y = 1;
    }
  - |
    if (a) {
        return 1;
    }
    x = 1;
    if (b) {
        y = 1;
    }
  - |
    if (a) {
        xs.forEach((x) => {
            return;
        });
    }
    if (b) {
        y();
    }
  - |
    if (a) {
        switch (x) {
            case 1:
                break;
        }
    }
    if (b) {
        y();
    }
  - |
    if (a) {
        return 1;
    } else {
        return 2;
    }
    if (b) {
        y();
    }
  - |
    switch (x) {
        case 1:
            if (a) {
                return 1;
            }
        case 2:
            if (b) {
                y();
            }
    }
  - |
    if (a) {
        return 1;
    }
    const c = () => {
        if (b) {
            y();
        }
    };
  - |
    if (a) {
        // return 1;
    }
    if (b) {
        y();
    }
  - |
    function* g() {
        if (a) {
            yield 1;
        }
        if (b) {
            y();
        }
    }
invalid:
  - |
    if (a) {
        return 1;
    }
    if (b) {
        x = 1;
    }
  - |
    if (gate != null) {
        return gate.future;
    }
    if (ok) {
        connected = true;
    }
  - |
    if (a) {
        throw new Error();
    }
    if (b) {
        x = 1;
    }
  - |
    for (const x of xs) {
        if (a) {
            break;
        }
        if (b) {
            y();
        }
    }
  - |
    for (const x of xs) {
        if (a) {
            continue;
        }
        if (b) {
            y();
        }
    }
  - |
    if (a) {
        x = 1;
        return; // done
    }
    if (b) {
        y();
    }
  - |
    if (a) {
        return 1;
    }
    // comment
    /* comment */
    if (b) {
        x = 1;
    }
  - |
    if (a) {
        return 1;
    } else if (b) {
        throw e;
    }
    if (c) {
        x = 1;
    }
  - |
    if (a) return;
    if (b) return;
  - |
    outer: for (const x of xs) {
        for (const y of ys) {
            if (a) {
                continue outer;
            }
            if (b) {
                z();
            }
        }
    }
  - |
    switch (x) {
        case 1:
            if (a) {
                break;
            }
            if (b) {
                y();
            }
            break;
    }
  - |
    async function f() {
        if (a) {
            return await g();
            // TODO: retry
        }
        if (b) {
            y();
        }
    }
