id: braces-placement-javascript
valid:
  - |
    if (a) {
        b();
    } else if (c) {
        d();
    } else {
        e();
    }
  - |
    if (a) {
        b();
    }
    else {
        c();
    }
  - |
    if (a &&
        b) { // comment
        c();
    }
  - |
    if (a) {
    }
  - |
    if (xs.some((x) => { return x; })) {
        b();
    }
  - 'function f() { return { a: 1 }; }'
  - |
    if (a) { /* comment */
        b();
    }
  - |
    if (a) {
        b(); // }
    }
  - |
    if (a) {
        foo({
            x: 1,
        });
    }
  - |
    if (`${a}` === b) {
        s = `${c}`;
    }
  - |
    if (isEqual(a, { x: 1 })) {
        c();
    }
  - |
    if (
        a &&
        b
    ) {
        c();
    }
  - 'for (const x of xs) { y(); }'
  - "if (a) {\r\n    b();\r\n} else {\r\n    c();\r\n}\r\n"
invalid:
  - if (a) { b(); }
  - if (a) {}
  - |
    if (a)
    {
        b();
    }
  - |
    if (a) {
        b();
    } else
    {
        c();
    }
  - |
    if (a) {
        b(); }
  - |
    if (a) { b();
    }
  - |
    if (a) {
        b();
    } else { c(); }
  - |
    if (a) {
        b();
    } else if (c)
    {
        d();
    }
  - |
    if (a) {
        b();
    } else if (c) { d(); }
  - |
    if (a) // comment
    {
        b();
    }
  - 'if (a) { /* nothing */ }'
