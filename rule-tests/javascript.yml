id: no-else-after-exit-javascript
valid:
  - |
    function f() {
        if (a) {
            return a;
        } else if (b) {
            return b;
        }

        return c;
    }
  - |
    function f() {
        if (a) {
            x();
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            return a;
        } else if (b) {
            x();
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            xs.forEach((x) => {
                return;
            });
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            try {
                return g();
            } catch (e) {
                log(e);
            }
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            x();
        } else if (b) {
            return b;
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            return a;
        } else /* fallback */ if (b) {
            x();
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            if (b) {
                return b;
            }
        } else {
            y();
        }
    }
  - |
    function f() {
        if (a) {
            return a;
        } else if (b) {
            throw e;
        } else if (c) {
            x();
        } else {
            y();
        }
    }
invalid:
  - |
    function f() {
        if (a) {
            return a;
        } else if (b) {
            return b;
        } else {
            return c;
        }
    }
  - |
    function f() {
        if (a) {
            throw e;
        } else {
            x();
        }
    }
  - |
    function f() {
        for (const x of xs) {
            if (a) {
                continue;
            } else {
                y();
            }
        }
    }
  - |
    function f() {
        if (a) {
            return a;
            // unreachable
        } else {
            y();
        }
    }
  - |
    switch (x) {
        case 1:
            if (a) {
                break;
            } else {
                y();
            }
    }
  - |
    function f() {
        if (a) {
            x();
        } else {
            if (b) {
                return b;
            } else {
                y();
            }
        }
    }
