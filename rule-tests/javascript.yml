id: brace-style-javascript
valid:
  - |
    if (a) {
        b();
    } else if (c) {
        d();
    } else {
        e();
    }
  - |
    if (a) {
        b();
    }
    else {
        c();
    }
  - |
    if (a &&
        b) { // comment
        c();
    }
  - |
    if (a) {
    }
  - |
    if (xs.some((x) => { return x; })) {
        b();
    }
  - 'function f() { return { a: 1 }; }'
invalid:
  - if (a) { b(); }
  - if (a) {}
  - |
    if (a)
    {
        b();
    }
  - |
    if (a) {
        b();
    } else
    {
        c();
    }
  - |
    if (a) {
        b(); }
  - |
    if (a) { b();
    }
  - |
    if (a) {
        b();
    } else { c(); }
  - |
    if (a) {
        b();
    } else if (c)
    {
        d();
    }
