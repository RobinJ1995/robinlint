id: brace-style-csharp
valid:
  - |
    class A {
        void F() {
            if (a) {
                B();
            } else if (c) {
                D();
            } else {
                E();
            }
        }
    }
  - |
    class A {
        void F() {
            if (a) {
                B();
            }
            else {
                C();
            }
            if (a &&
                b) { // comment
                C();
            }
            if (a) {
            }
        }
    }
invalid:
