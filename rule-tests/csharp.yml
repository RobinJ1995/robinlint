id: function-reference-csharp
valid:
  - 'a.Select(F);'
  - 'a.Select(x => Foo.Bar(x));'
  - 'a.Select(x => F(x, 1));'
  - 'a.Select((x, y) => F(x));'
  - 'a.Select(async x => F(x));'
  - 'a.Select((x, y) => F(y));'
  - 'a.Select(x => F(x).G());'
  - 'a.Sort((a, b) => F(b).CompareTo(F(a)));'
  - 'a.Select(x => F(x!));'
  - 'a.Select(x => F(y));'
  - 'a.Select(x => F(G(x)));'
  - 'a.Select(x => F(x.Id));'
  - 'a.Select(x => F(y, x));'
  - 'a.Select(x => F<int>(x));'
  - 'a.Select(x => this.F(x));'
  - 'a.Select(x => new Foo(x));'
  - 'a.Select(x => { return F(x); });'
  - 'button.Click += (s, e) => OnClick(s, e);'
  - 'a.Select(x => F(x: 1));'
  - 'a.ForEach(x => F(ref x));'
  - 'a.ForEach(x => TryParse(out x));'
invalid:
  - 'a.Select(x => F(x));'
  - 'a.Select((x) => F(x));'
  - 'a.Select((int x) => F(x));'
  - 'a.Select(static x => F(x));'
  - 'a.Where(predicate: x => IsValid(x));'
  - 'Func<int, int> f = (int x) => F(x);'
