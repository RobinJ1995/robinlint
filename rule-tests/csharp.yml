    class A {
        void F() {
            if (a) { B(); }
        }
    }
  - |
    class A {
        void F() {
            if (a) {}
        }
    }
  - |
    class A {
        void F() {
            if (a)
            {
                B();
            }
        }
    }
  - |
    class A {
        void F() {
            if (a) {
                B();
            } else
            {
                C();
            }
        }
    }
