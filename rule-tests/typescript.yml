id: braces-typescript
valid:
  - |
    if (a) {
        b();
    }
  - |
    if (a) {
        b();
    } else {
        c();
    }
  - |
    if (a) {
        b();
    } else if (c) {
        d();
    } else {
        e();
    }
  - 'x = a ? b : c;'
  - |
    function isFoo(x: unknown): x is Foo {
        if (typeof x !== 'object' || x === null) {
            return false;
        }
        return 'foo' in x;
    }
  - 'while (queue.length > 0) queue.pop();'
  - 'for (const x of xs) process(x);'
  - "type A<T> = T extends string ? 'a' : 'b';"
  - |
    class C {
        @Input() set value(v: string) {
            if (v) {
                this.v = v!;
            } /* c */ else /* d */ {
                this.v = '';
            }
        }
    }
  - |
    if (a) {
        b();
    } else /* c */ if (c) {
        d();
    }
  - 'const abs = (x: number): number => (x > 0 ? x : -x);'
invalid:
  - if (a) b();
  - if (a) return;
  - |
    if (a) {
        b();
    } else c();
  - |
    if (a) {
        b();
    } else if (c) d();
  - |
    if (a)
        b();
  - |
    if (a) {
        b();
    } else
        // comment
        c();
  - |
    if (a) if (b) {
        c();
    }
  - |
    function first<T>(xs: T[]): T | undefined {
        if (xs.length === 0) return undefined;
        return xs[0]!;
    }
  - |
    class C {
        get name(): string {
            if (this.first) {
                return this.first;
            } else if (this.last) {
                return this.last;
            } else return '';
        }
    }
