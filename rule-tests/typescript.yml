id: function-reference-typescript
valid:
  - 'a.map(f);'
  - 'a.map(x => JSON.parse(x));'
  - 'a.map(x => f(x, 1));'
  - 'a.map((x, y) => f(x));'
  - 'a.map(async x => f(x));'
  - 'a.map(x => f(y));'
  - 'a.map((x, y) => f(y));'
  - 'a.map(x => f(x).g());'
  - 'a.sort((a, b) => f(b).localeCompare(f(a)));'
  - 'a.map((x: string) => f(x));'
  - 'a.map((x): number => f(x));'
  - 'a.map(<T>(x: T) => f(x));'
  - 'a.map((x) => f<string>(x));'
  - 'a.map((x) => f?.(x));'
  - 'a.map((x) => f(x!));'
  - 'a.map((x) => f(x as Foo));'
  - 'a.map((x) => f(x)!);'
  - 'a.map((x) => new Foo(x));'
  - 'a.map(({ value }) => trim(value));'
  - 'paths.map((p) => import(p));'
  - "['1', '2'].map((x) => parseInt(x));"
  - 'Promise.all(urls.map((url) => fetch(url)));'
invalid:
  - 'a.map(x => f(x));'
  - 'a.map((x) => f(x));'
  - 'a.filter((x) => isDefined(x));'
  - 'promise.then((res) => handle(res));'
  - 'a.map((x) => f(/* c */ x));'
