id: braces-php
valid:
  - |
    <?php
    if ($a) {
        b();
    } elseif ($c) {
        d();
    } else if ($e) {
        f();
    } else {
        g();
    }
  - |
    <?php
    if ($a):
        b();
    elseif ($c):
        d();
    else:
        e();
    endif;
  - |
    <?php if ($user) { ?>
        <p>Hello, <?= $user->name ?></p>
    <?php } elseif ($guest) { ?>
        <p>Hello, guest</p>
    <?php } else { ?>
        <a href="/login">Log in</a>
    <?php } ?>
  - |
    <?php foreach ($items as $item): ?>
        <?php if ($item->visible): ?>
            <li><?= $item->name ?></li>
        <?php else: ?>
            <li>hidden</li>
        <?php endif; ?>
    <?php endforeach; ?>
  - |
    <?php
    class Repo {
        public function find($xs) {
            return array_filter($xs, function ($x) {
                if ($x > 1) {
                    return true;
                }
                return false;
            });
        }
    }
  - |
    <?php
    foreach ($xs as $x) f($x);
    while ($a) g();
    $y = $a ? b() : c();
    $z = match (true) {
        $a => 1,
        default => 2,
    };
  - |
    <?php
    if ($a) /* why */ {
        b();
    } else {
        if ($c) {
            d();
        }
    }
  - |
    <?php
    if ($a):
        if ($b) {
            c();
        }
    else:
        d();
    endif;
invalid:
  - <?php if ($a) b();
  - |
    <?php
    if ($a)
        return;
  - |
    <?php
    if ($a) {
        b();
    } else c();
  - |
    <?php
    if ($a) {
        b();
    } elseif ($c) d();
  - |
    <?php
    if ($a) {
        b();
    } else if ($c) d();
  - |
    <?php
    function f($a, $b) {
        if ($a) {
            return 1;
        } elseif ($b) {
            return 2;
        } else
            return 3;
    }
