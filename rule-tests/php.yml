id: function-reference-php
valid:
  - '<?php array_map(f(...), $a);'
  - '<?php array_map(fn($x) => $o->f($x), $a);'
  - '<?php array_map(fn($x) => f($x, 1), $a);'
  - '<?php array_map(fn($x, $y) => f($x), $a);'
  - '<?php array_map(fn($x, $y) => f($y), $a);'
  - '<?php array_map(fn($x) => f($x)->g(), $a);'
  - '<?php usort($a, fn($a, $b) => f($b) <=> f($a));'
  - '<?php array_map(fn(...$x) => f($x), $a);'
  - '<?php array_map(fn($x) => f(...$x), $a);'
  - '<?php array_map(fn($x) => Str::f($x), $a);'
  - '<?php $names = collect($users)->map(fn($u) => trim($u));'
  - '<?php $xs = $c->filter(fn($x) => is_numeric($x));'
  - '<?php array_walk($a, fn($x) => f($x));'
  - '<?php array_filter($a, fn($x) => is_numeric($x), ARRAY_FILTER_USE_BOTH);'
  - '<?php array_map(fn($x) => f($x), $a, $b);'
  - '<?php array_map(fn(int $x) => f($x), $a);'
  - '<?php array_map(fn($x): string => f($x), $a);'
  - '<?php array_map(fn($x) => f(value: $x), $a);'
  - '<?php array_map(fn($x) => isset($x), $a);'
invalid:
  - '<?php array_map(fn($x) => f($x), $a);'
  - '<?php $ids = array_filter($ids, fn($id) => is_numeric($id));'
  - '<?php $rows = array_map(static fn($row) => format_row($row), $rows);'
  - |
    <?php
    $names = array_map(
        fn($user) => user_name($user),
        $users
    );
