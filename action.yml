name: robinlint
description: Lint
inputs:
  exclude:
    description: Newline-separated .gitignore-style patterns of files and folders to skip
    required: false
    default: ''
  rules:
    description: Rule overrides
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Lint
      shell: bash
      env:
        EXCLUDE: ${{ inputs.exclude }}
        RULES: ${{ inputs.rules }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        npm ci --prefix "$GITHUB_ACTION_PATH"
        node "$GITHUB_ACTION_PATH/lint.js"
