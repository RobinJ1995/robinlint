exclude:
  - pubspec.lock
  - Podfile.lock
  - '*.g.dart'
  - '*.freezed.dart'
  - '*.mocks.dart'
  - '*.Designer.cs'
  - '*.g.cs'
  - '*_pb2.py'
  - '*_pb2_grpc.py'
rules:
  editorconfig: true
  braces: true
  braces-placement: true
  elseif: true
  no-else-after-exit: true
  no-single-parameter-brackets: true
  no-ads-in-prs: only-new
  no-ads-in-commits: only-new
  no-tools-as-commit-author: only-new
  no-ads-in-branch-names: false
