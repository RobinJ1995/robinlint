name: CI

on:
  push:
  pull_request:
    # to trigger when PR description is updated
    types: [opened, synchronize, reopened, edited]
  # to trigger when PR reviews and review comments are added
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx ast-grep test --skip-snapshot-tests
      - run: node --test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  action-fails-on-violations:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: robinlint
      - name: Make a repo out of the bad samples
        run: |
          git init -q
          for f in robinlint/tests/samples/*/[Bb]ad.*; do
              cp "$f" .
              git add "$(basename "$f")"
          done
      - id: lint
        continue-on-error: true
        uses: ./robinlint
      - run: test "${{ steps.lint.outcome }}" = failure

  robinlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          exclude: |
            tests/samples/
          rules: |
            editorconfig: true
            braces: true
            braces-placement: true
            elseif: true
            no-else-after-exit: true
            function-reference: true
            no-single-parameter-brackets: true
            no-ads-in-prs: true
            no-ads-in-pr-comments: true
            no-ads-in-commits: true
            no-tools-as-commit-author: true
            no-ads-in-branch-names: true
