id: braces-java
language: java
severity: error
message: if statements use braces.
rule:
  kind: if_statement
  any:
    - has:
        field: consequence
        not:
          kind: block
    - has:
        field: alternative
        not:
          any:
            - kind: block
            - kind: if_statement
---
id: elseif-java
language: java
severity: error
message: consecutive if statements that always exit are an elseif.
utils:
  exit:
    any:
      - kind: return_statement
      - kind: throw_statement
      - kind: break_statement
      - kind: continue_statement
  ends-with-exit:
    any:
      - matches: exit
      - kind: block
        has:
          nthChild:
            position: 1
            reverse: true
            ofRule:
              not:
                any:
                  - kind: line_comment
                  - kind: block_comment
          matches: exit
  exiting-chain:
    kind: if_statement
    has:
      field: consequence
      matches: ends-with-exit
    not:
      has:
        field: alternative
        not:
          matches: exiting-chain
  # Turning this if into an else-if would shrink the variable's scope to that else.
  declares-variable:
    any:
      - kind: instanceof_expression
        has:
          field: name
          kind: identifier
      - kind: record_pattern
rule:
  kind: if_statement
  not:
    has:
      field: condition
      has:
        stopBy: end
        matches: declares-variable
  follows:
    stopBy:
      not:
        any:
          - kind: line_comment
          - kind: block_comment
    matches: exiting-chain
---
id: braces-placement-java
language: java
severity: error
message: if statement braces go on the correct line.
utils:
  allman-else:
    regex: '\belse[ \t]*(//.*)?\r?\n\s*\{'
rule:
  kind: block
  any:
    - regex: '^\{[ \t]*[^\s/]|\S[ \t]*\}$'
      any:
        - inside:
            kind: if_statement
            field: consequence
        - inside:
            kind: if_statement
            field: alternative
    - inside:
        kind: if_statement
        field: consequence
        regex: '^if\b[^{]*\)[ \t]*(//.*)?\r?\n\s*\{'
    # Only the innermost offending else is reported until it's fixed.
    - not:
        matches: allman-else
      inside:
        kind: if_statement
        field: alternative
        matches: allman-else
        not:
          has:
            field: consequence
            matches: allman-else
---
id: no-else-after-exit-java
language: java
severity: error
message: no useless else statements
utils:
  exit:
    any:
      - kind: return_statement
      - kind: throw_statement
      - kind: break_statement
      - kind: continue_statement
  ends-with-exit:
    any:
      - matches: exit
      - kind: block
        has:
          nthChild:
            position: 1
            reverse: true
            ofRule:
              not:
                any:
                  - kind: line_comment
                  - kind: block_comment
          matches: exit
  exiting-branches:
    kind: if_statement
    has:
      field: consequence
      matches: ends-with-exit
    any:
      - not:
          inside:
            kind: if_statement
            field: alternative
      - inside:
          kind: if_statement
          field: alternative
          matches: exiting-branches
rule:
  kind: block
  inside:
    kind: if_statement
    field: alternative
    matches: exiting-branches
---
id: function-reference-java
language: java
severity: error
message: pass a method reference, not a lambda that only calls the method.
rule:
  any:
    - pattern: $X -> $F($X)
    - pattern: ($X) -> $F($X)
constraints:
  F:
    kind: identifier
