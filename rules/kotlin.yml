id: braces-kotlin
language: kotlin
severity: error
message: if statements use braces.
rule:
  kind: control_structure_body
  not:
    regex: ^\{
  any:
    - inside:
        kind: if_expression
        field: consequence
        matches: kotlin-statement-if
    - inside:
        kind: if_expression
        field: alternative
        matches: kotlin-statement-if
      not:
        has:
          kind: if_expression
---
id: elseif-kotlin
language: kotlin
severity: error
message: consecutive if statements that always exit are an elseif.
utils:
  comment:
    any:
      - kind: line_comment
      - kind: multiline_comment
  ends-with-exit:
    kind: control_structure_body
    any:
      - has:
          kind: jump_expression
      - has:
          kind: statements
          has:
            nthChild:
              position: 1
              reverse: true
              ofRule:
                not:
                  matches: comment
            kind: jump_expression
  exiting-chain:
    kind: if_expression
    has:
      field: consequence
      matches: ends-with-exit
    not:
      has:
        field: alternative
        not:
          has:
            matches: exiting-chain
rule:
  kind: if_expression
  matches: kotlin-statement-if
  inside:
    kind: statements
  follows:
    stopBy:
      not:
        matches: comment
    matches: exiting-chain
---
id: braces-placement-kotlin
language: kotlin
severity: error
message: if statement braces go on the correct line.
utils:
  allman-else:
    regex: '\belse[ \t]*(//.*)?\n\s*\{'
rule:
  kind: control_structure_body
  regex: '^\{'
  any:
    - regex: '^\{[ \t]*[^\s/]|\S[ \t]*\}$'
      inside:
        kind: if_expression
        matches: kotlin-statement-if
    - inside:
        kind: if_expression
        field: consequence
        matches: kotlin-statement-if
        regex: '^if\b[^{]*\)[ \t]*(//.*)?\n\s*\{'
    # Only the innermost offending else is reported until it's fixed.
    - not:
        matches: allman-else
      inside:
        kind: if_expression
        field: alternative
        all:
          - matches: kotlin-statement-if
          - matches: allman-else
        not:
          has:
            field: consequence
            matches: allman-else
---
id: no-else-after-exit-kotlin
language: kotlin
severity: error
message: no useless else statements
utils:
  comment:
    any:
      - kind: line_comment
      - kind: multiline_comment
  ends-with-exit:
    kind: control_structure_body
    any:
      - has:
          kind: jump_expression
      - has:
          kind: statements
          has:
            nthChild:
              position: 1
              reverse: true
              ofRule:
                not:
                  matches: comment
            kind: jump_expression
  exiting-branches:
    kind: if_expression
    matches: kotlin-statement-if
    has:
      field: consequence
      matches: ends-with-exit
    any:
      - inside:
          kind: statements
      - inside:
          kind: control_structure_body
          inside:
            kind: if_expression
            field: alternative
            matches: exiting-branches
rule:
  kind: control_structure_body
  not:
    has:
      kind: if_expression
  inside:
    kind: if_expression
    field: alternative
    matches: exiting-branches
---
id: function-reference-kotlin
language: kotlin
severity: error
message: pass a function reference, not a lambda that only calls the function.
utils:
  only-child:
    all:
      - nthChild: 1
      - nthChild:
          position: 1
          reverse: true
rule:
  kind: lambda_literal
  has:
    kind: statements
    has:
      kind: call_expression
      matches: only-child
      all:
        - has:
            kind: simple_identifier
            nthChild: 1
        - has:
            kind: call_suffix
            not:
              has:
                any:
                  - kind: annotated_lambda
                  # `::f` can't take explicit type arguments.
                  - kind: type_arguments
            has:
              kind: value_arguments
              has:
                kind: value_argument
                matches: only-child
                has:
                  kind: simple_identifier
                  matches: only-child
                  pattern: $X
  any:
    - has:
        kind: lambda_parameters
        has:
          kind: variable_declaration
          matches: only-child
          has:
            kind: simple_identifier
            matches: only-child
            pattern: $X
    - not:
        any:
          - has:
              kind: lambda_parameters
          # `it` may belong to an enclosing lambda, e.g. `xs.forEach { launch { send(it) } }`.
          - inside:
              stopBy: end
              kind: lambda_literal
              not:
                has:
                  kind: lambda_parameters
      has:
        kind: statements
        has:
          stopBy: end
          kind: value_argument
          regex: ^it$
