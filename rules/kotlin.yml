id: braces-kotlin
language: kotlin
severity: error
message: if statements use braces.
rule:
  kind: control_structure_body
  not:
    regex: ^\{
  any:
    - inside:
        kind: if_expression
        field: consequence
        matches: kotlin-statement-if
    - inside:
        kind: if_expression
        field: alternative
        matches: kotlin-statement-if
      not:
        has:
          kind: if_expression
---
id: elseif-kotlin
language: kotlin
severity: error
message: consecutive if statements that always exit are an elseif.
utils:
  comment:
    any:
      - kind: line_comment
      - kind: multiline_comment
  ends-with-exit:
    kind: control_structure_body
    any:
      - has:
          kind: jump_expression
      - has:
          kind: statements
          has:
            nthChild:
              position: 1
              reverse: true
              ofRule:
                not:
                  matches: comment
            kind: jump_expression
  exiting-chain:
    kind: if_expression
    has:
      field: consequence
      matches: ends-with-exit
    not:
      has:
        field: alternative
        not:
          has:
            matches: exiting-chain
rule:
  kind: if_expression
  matches: kotlin-statement-if
  inside:
    kind: statements
  follows:
    stopBy:
      not:
        matches: comment
    matches: exiting-chain
---
id: braces-placement-kotlin
language: kotlin
severity: error
message: if statement braces go on the correct line.
utils:
  allman-else:
    regex: '\belse[ \t]*(//.*)?\n\s*\{'
rule:
  kind: control_structure_body
  regex: '^\{'
  any:
    - regex: '^\{[ \t]*[^\s/]|\S[ \t]*\}$'
      inside:
        kind: if_expression
        matches: kotlin-statement-if
    - inside:
        kind: if_expression
        field: consequence
        matches: kotlin-statement-if
        regex: '^if\b[^{]*\)[ \t]*(//.*)?\n\s*\{'
    # Only the innermost offending else is reported until it's fixed.
    - not:
        matches: allman-else
      inside:
        kind: if_expression
        field: alternative
        all:
          - matches: kotlin-statement-if
          - matches: allman-else
        not:
          has:
            field: consequence
            matches: allman-else
---
id: no-else-after-exit-kotlin
language: kotlin
severity: error
message: no useless else statements
utils:
  comment:
    any:
      - kind: line_comment
      - kind: multiline_comment
  ends-with-exit:
    kind: control_structure_body
    any:
      - has:
          kind: jump_expression
      - has:
          kind: statements
          has:
            nthChild:
              position: 1
              reverse: true
              ofRule:
                not:
                  matches: comment
            kind: jump_expression
  exiting-branches:
    kind: if_expression
    matches: kotlin-statement-if
    has:
      field: consequence
      matches: ends-with-exit
    any:
      - inside:
          kind: statements
      - inside:
          kind: control_structure_body
          inside:
            kind: if_expression
            field: alternative
            matches: exiting-branches
rule:
  kind: control_structure_body
  not:
    has:
      kind: if_expression
  inside:
    kind: if_expression
    field: alternative
    matches: exiting-branches
---
id: function-reference-kotlin
language: kotlin
severity: error
message: pass a function reference, not a lambda that only calls the function.
utils:
  only-child:
    all:
      - nthChild: 1
      - nthChild:
          position: 1
          reverse: true
rule:
  kind: lambda_literal
  has:
    kind: statements
    has:
      kind: call_expression
      matches: only-child
      all:
        - has:
            kind: simple_identifier
            nthChild: 1
        - has:
            kind: call_suffix
            not:
              has:
                any:
                  - kind: annotated_lambda
                  # `::f` can't take explicit type arguments.
                  - kind: type_arguments
            has:
              kind: value_arguments
              has:
                kind: value_argument
                matches: only-child
                has:
                  kind: simple_identifier
                  matches: only-child
                  pattern: $X
  any:
    - has:
        kind: lambda_parameters
        has:
          kind: variable_declaration
          matches: only-child
          has:
            kind: simple_identifier
            matches: only-child
            pattern: $X
    - not:
        any:
          - has:
              kind: lambda_parameters
          # `it` may belong to an enclosing lambda, e.g. `xs.forEach { launch { send(it) } }`.
          - inside:
              stopBy: end
              kind: lambda_literal
              not:
                has:
                  kind: lambda_parameters
      has:
        kind: statements
        has:
          stopBy: end
          kind: value_argument
          regex: ^it$
---
id: named-function-parameters-kotlin
language: kotlin
severity: error
message: name the arguments of calls with more than 3 parameters.
# lint.js also exempts calls to vararg and function-typed declarations.
utils:
  named-argument:
    kind: value_argument
    has:
      regex: '^=$'
  nth-argument-4:
    nthChild:
      position: 4
      ofRule:
        kind: value_argument
  nth-argument-3:
    nthChild:
      position: 3
      ofRule:
        kind: value_argument
  # $NAME: `f` in `f(...)`, `a.f(...)`, `a?.f(...)`.
  callee:
    nthChild: 1
    any:
      - kind: simple_identifier
        pattern: $NAME
      - kind: navigation_expression
        has:
          kind: navigation_suffix
          has:
            kind: simple_identifier
            pattern: $NAME
  # Varargs, and `invoke` (mostly function types).
  unnameable-name:
    regex: >-
      ^(listOf|listOfNotNull|mutableListOf|arrayListOf|setOf|setOfNotNull|mutableSetOf|hashSetOf|linkedSetOf|sortedSetOf|mapOf|mutableMapOf|hashMapOf|linkedMapOf|sortedMapOf|arrayOf|u?(int|long|short|byte)ArrayOf|(char|float|double|boolean)ArrayOf|sequenceOf|flowOf|persistent\w*Of|mutableState(List|Map)Of|maxOf|minOf|compareBy|compareByDescending|compareValuesBy|awaitAll|joinAll|merge|combine|remember|rememberSaveable|LaunchedEffect|DisposableEffect|produceState|key|CompositionLocalProvider|(linear|horizontal|vertical|radial|sweep)Gradient|Path|of|asList|hash|join|concat|format|printf|addAll|allOf|anyOf|assertAll|arguments|tuple|row|withData|trace|debug|info|warn|warning|error|contains\w*|doesNotContain\w*|should(Not)?Contain\w*|is(Any|None|One)Of|isIn|isNotIn|hasItems|startsWith|endsWith|thenReturn|thenThrow|doReturn|verifyNoMoreInteractions|verifyNoInteractions|reset|clearMocks|confirmVerified|mockkObject|mockkStatic|unmockkObject|unmockkStatic|invoke)$
  unnameable-callee:
    nthChild: 1
    any:
      - kind: simple_identifier
        matches: unnameable-name
      - kind: navigation_expression
        any:
          - has:
              kind: navigation_suffix
              has:
                kind: simple_identifier
                matches: unnameable-name
          - regex: '^(Timber\b|Paths\s*\.\s*get$)'
  # Java constructors and static calls; Java has no named arguments.
  java-package:
    regex: '^(java|javax|jakarta|android|org\.(joda|apache|eclipse|junit|mockito|assertj|hamcrest|slf4j|springframework)|io\.(netty|reactivex)|com\.google\.common|com\.fasterxml)\s*\.'
  java-callee:
    nthChild: 1
    any:
      - kind: navigation_expression
        matches: java-package
      - any:
          - kind: simple_identifier
            matches: java-class
          - kind: navigation_expression
            has:
              nthChild: 1
              kind: simple_identifier
              matches: java-class
  java-class:
    any:
      - regex: ^(System|Math|StrictMath|Thread|ThreadGroup|Runtime|Process|ProcessBuilder|Integer|Character|Objects|ClassLoader)$
      - all:
          - pattern: $CLASS
          - inside:
              stopBy: end
              kind: source_file
              has:
                kind: import_list
                has:
                  kind: import_header
                  has:
                    kind: identifier
                    matches: java-package
                  any:
                    - has:
                        kind: import_alias
                        has:
                          kind: type_identifier
                          pattern: $CLASS
                    - not:
                        has:
                          kind: import_alias
                      has:
                        kind: identifier
                        has:
                          kind: simple_identifier
                          nthChild:
                            position: 1
                            reverse: true
                          pattern: $CLASS
rule:
  kind: value_arguments
  all:
    - has:
        kind: value_argument
        not:
          matches: named-argument
    - not:
        has:
          kind: value_argument
          has:
            kind: spread_expression
    # More than 3, counting a trailing lambda.
    - any:
        - has:
            matches: nth-argument-4
        - has:
            matches: nth-argument-3
          precedes:
            kind: annotated_lambda
    - any:
        - inside:
            kind: call_suffix
            inside:
              kind: call_expression
              all:
                - has:
                    matches: callee
                - not:
                    has:
                      matches: unnameable-callee
                - not:
                    has:
                      matches: java-callee
        - inside:
            kind: constructor_delegation_call
            regex: ^this\b
