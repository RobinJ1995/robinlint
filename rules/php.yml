id: braces-php
language: php
severity: error
message: if statements use braces.
rule:
  any:
    - kind: if_statement
    - kind: else_if_clause
    - kind: else_clause
  has:
    field: body
    not:
      any:
        - kind: compound_statement
        - kind: colon_block
        - kind: if_statement
---
id: elseif-php
language: php
severity: error
message: consecutive if statements that always exit are an elseif.
utils:
  exit:
    any:
      - kind: return_statement
      - kind: expression_statement
        has:
          kind: throw_expression
      - kind: break_statement
      - kind: continue_statement
  ends-with-exit:
    any:
      - matches: exit
      - any:
          - kind: compound_statement
          - kind: colon_block
        has:
          nthChild:
            position: 1
            reverse: true
            ofRule:
              not:
                kind: comment
          matches: exit
  exiting-chain:
    kind: if_statement
    has:
      field: body
      matches: ends-with-exit
    not:
      has:
        field: alternative
        not:
          any:
            - kind: else_if_clause
              has:
                field: body
                matches: ends-with-exit
            - kind: else_clause
              has:
                field: body
                matches: exiting-chain
rule:
  kind: if_statement
  follows:
    stopBy:
      not:
        kind: comment
    matches: exiting-chain
---
id: braces-placement-php
language: php
severity: error
message: if statement braces go on the correct line.
rule:
  kind: compound_statement
  any:
    - regex: '^\{[ \t]*[^\s/#]|\S[ \t]*\}$'
      inside:
        field: body
        any:
          - kind: if_statement
          - kind: else_if_clause
          - kind: else_clause
    - inside:
        kind: if_statement
        field: body
        regex: '^if\b[^{]*\)[ \t]*(//.*|#.*)?\n\s*\{'
    - inside:
        kind: else_if_clause
        field: body
        regex: '^elseif\b[^{]*\)[ \t]*(//.*|#.*)?\n\s*\{'
    - inside:
        kind: else_clause
        field: body
        regex: '^else[ \t]*(//.*|#.*)?\n\s*\{'
---
id: no-else-after-exit-php
language: php
severity: error
message: no useless else statements
utils:
  exit:
    any:
      - kind: return_statement
      - kind: expression_statement
        has:
          kind: throw_expression
      - kind: break_statement
      - kind: continue_statement
  ends-with-exit:
    any:
      - matches: exit
      - any:
          - kind: compound_statement
          - kind: colon_block
        has:
          nthChild:
            position: 1
            reverse: true
            ofRule:
              not:
                kind: comment
          matches: exit
  exiting-branches:
    kind: if_statement
    has:
      field: body
      matches: ends-with-exit
    not:
      has:
        kind: else_if_clause
        not:
          has:
            field: body
            matches: ends-with-exit
    any:
      - not:
          inside:
            kind: else_clause
      - inside:
          kind: else_clause
          inside:
            kind: if_statement
            matches: exiting-branches
rule:
  kind: else_clause
  not:
    has:
      field: body
      kind: if_statement
  inside:
    kind: if_statement
    matches: exiting-branches
---
id: function-reference-php
language: php
severity: error
message: pass a first-class callable, not an arrow function that only calls the function.
utils:
  only-child:
    all:
      - nthChild: 1
      - nthChild:
          position: 1
          reverse: true
rule:
  kind: arrow_function
  has:
    field: parameters
    has:
      kind: simple_parameter
      matches: only-child
      has:
        field: name
        pattern: $X
  all:
    - has:
        field: body
        kind: function_call_expression
        all:
          - has:
              field: function
              kind: name
          - has:
              field: arguments
              has:
                kind: argument
                matches: only-child
                has:
                  kind: variable_name
                  pattern: $X
